name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python3 -m pip install -r requirements.txt
      - name: Unit tests (no network calls; every adapter is stubbed)
        run: python3 -m unittest discover -s tests -v
      - name: Route plan smoke test (no API calls)
        run: python3 -m arcturion_research --explain "latest research on retrieval evaluation"
